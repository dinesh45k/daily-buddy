spring.application.name=daily-buddy
server.port=8080

# H2 file database so tasks survive restarts (data/ is git-ignored)
spring.datasource.url=jdbc:h2:file:./data/dailybuddy;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# AI provider (key comes from an environment variable, never hard-code it)
ai.api-key=${ANTHROPIC_API_KEY:}
ai.model=${AI_MODEL:claude-sonnet-4-6}
ai.base-url=https://api.anthropic.com
ai.max-tokens=1000

# Show real error messages in API responses
server.error.include-message=always

# Google Gemini (optional). Used when no Anthropic key is set.
ai.gemini-api-key=${GEMINI_API_KEY:}
ai.gemini-model=${GEMINI_MODEL:gemini-2.5-flash}
